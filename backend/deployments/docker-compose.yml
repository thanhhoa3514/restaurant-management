services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22}
    environment:
      # If you change POSTGRES_* above, set DATABASE_URL too — compose
      # interpolation is single-pass and cannot build this from those vars.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/restaurant?sslmode=disable}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      JWT_TTL: ${JWT_TTL:-12h}
      SHUTDOWN_SECONDS: ${SHUTDOWN_SECONDS:-10}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restaurant?sslmode=disable
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

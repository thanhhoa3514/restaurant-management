openapi: 3.0.3
info:
  title: Restaurant QR Ordering API
  version: 0.1.0
  description: >
    HTTP API for QR-based restaurant ordering. Most staff endpoints require a JWT
    bearer token and a server-resolved permission. Guest endpoints under /api/v1/guest require an
    X-Session-Token issued by /api/v1/dining/join-session. Public endpoints require
    neither.
  x-response-envelope:
    description: Every JSON response includes the numeric HTTP status in `code`.
servers:
  - url: /
tags:
  - name: ops
    description: Liveness, readiness, realtime transport
  - name: identity
    description: Authentication and user management
  - name: catalog
    description: Menu item management (staff) and menu browsing (guest)
  - name: dining
    description: Table sessions and QR management
  - name: ordering
    description: Staff order operations
  - name: kitchen
    description: Kitchen display queue
  - name: guest-ordering
    description: Guest order lifecycle (QR session)
  - name: billing
    description: Invoicing and payments
paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness probe (does not touch DB)
      security: []
      responses:
        '200':
          description: Process is up
  /health/ready:
    get:
      tags: [ops]
      summary: Readiness probe (pings DB)
      security: []
      responses:
        '200':
          description: Ready to serve traffic
        '503':
          description: Dependencies unavailable
  /ws:
    get:
      tags: [ops]
      summary: WebSocket upgrade for realtime events
      security: []
      responses:
        '101':
          description: Switching protocols

  /api/v1/identity/authenticate:
    post:
      tags: [identity]
      summary: Login, returns JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
            example:
              restaurant_code: DEMO
              username: cashier
              password: demo1234
      responses:
        '200':
          description: Authenticated; response includes permission codes for shell rendering
        '401':
          description: Invalid credentials
  /api/v1/identity/me:
    get:
      tags: [identity]
      summary: Return the current staff identity and permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user, role, restaurant, and permission codes
        '401':
          description: Invalid or expired token
  /api/v1/identity/manage-users:
    post:
      tags: [identity]
      summary: Create or update users
      security:
        - bearerAuth: []
      description: 'Permission: identity.manage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaffoldRequest'
      responses:
        '200':
          description: User mutation result
        '403':
          description: Forbidden

  /api/v1/catalog/create-menu-item:
    post:
      tags: [catalog]
      summary: Create menu item
      security:
        - bearerAuth: []
      description: 'Permission: catalog.manage. Endpoint scaffold.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaffoldRequest'
      responses:
        '200':
          description: Created
  /api/v1/catalog/update-menu-item:
    post:
      tags: [catalog]
      summary: Update menu item
      security:
        - bearerAuth: []
      description: 'Permission: catalog.manage. Endpoint scaffold.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaffoldRequest'
      responses:
        '200':
          description: Updated
  /api/v1/catalog/delete-menu-item:
    post:
      tags: [catalog]
      summary: Delete menu item
      security:
        - bearerAuth: []
      description: 'Permission: catalog.manage. Endpoint scaffold.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaffoldRequest'
      responses:
        '200':
          description: Deleted
  /api/v1/catalog/toggle-availability:
    post:
      tags: [catalog]
      summary: Set menu item availability
      security:
        - bearerAuth: []
      description: 'Permission: catalog.manage. Endpoint scaffold.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaffoldRequest'
      responses:
        '200':
          description: Availability set
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
        '403':
          description: Forbidden (not MANAGER)

  /api/v1/billing/adjust-invoice:
    post:
      tags: [billing]
      summary: Adjust invoice discounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInvoiceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
  /api/v1/billing/void-invoice:
    post:
      tags: [billing]
      summary: Void an invoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, void_reason]
              properties:
                invoice_id:
                  type: string
                  format: uuid
                void_reason:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'

  /api/v1/dining/join-session:
    post:
      tags: [dining]
      summary: QR guest entry; issues session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSessionRequest'
      responses:
        '200':
          description: Session joined
  /api/v1/dining/open-session:
    post:
      tags: [dining]
      summary: Open a table session
      security:
        - bearerAuth: []
      description: 'Permission: dining.serve'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionRequest'
      responses:
        '200':
          description: Session opened
  /api/v1/dining/close-session:
    post:
      tags: [dining]
      summary: Close a table session
      security:
        - bearerAuth: []
      description: 'Permission: dining.cashier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSessionRequest'
      responses:
        '200':
          description: Session closed
  /api/v1/dining/manage-table-qr:
    post:
      tags: [dining]
      summary: Manage table QR codes
      security:
        - bearerAuth: []
      description: 'Permission: dining.manage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageTableQRRequest'
      responses:
        '200':
          description: QR managed
  /api/v1/dining/table-qrs:
    get:
      tags: [dining]
      summary: List restaurant tables and active QR codes
      security:
        - bearerAuth: []
      description: 'Permission: dining.manage'
      responses:
        '200':
          description: Table QR list

  /api/v1/guest/menu/categories:
    get:
      tags: [catalog]
      summary: List menu categories (guest)
      security:
        - sessionToken: []
      responses:
        '200':
          description: Category list
  /api/v1/guest/menu/items:
    get:
      tags: [catalog]
      summary: List menu items (guest)
      security:
        - sessionToken: []
      parameters:
        - name: category_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item list
  /api/v1/guest/menu/items/{id}:
    get:
      tags: [catalog]
      summary: Get menu item detail (guest)
      security:
        - sessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item detail

  /api/v1/guest/orders:
    post:
      tags: [guest-ordering]
      summary: Place a guest order
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestPlaceOrderRequest'
      responses:
        '200':
          description: Order placed
        '400':
          description: Cart validation failed (line_errors)
    get:
      tags: [guest-ordering]
      summary: View this session's orders
      security:
        - sessionToken: []
      responses:
        '200':
          description: Order list
  /api/v1/guest/orders/{orderId}/items:
    put:
      tags: [guest-ordering]
      summary: Edit items on a guest order
      security:
        - sessionToken: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestEditOrderRequest'
      responses:
        '200':
          description: Order updated
        '400':
          description: Line operation failed (line_errors)
        '409':
          description: Conflict (line_errors)
  /api/v1/guest/orders/{orderId}:
    delete:
      tags: [guest-ordering]
      summary: Cancel a guest order
      security:
        - sessionToken: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order cancelled
  /api/v1/guest/orders/{orderId}/cancel-requests:
    post:
      tags: [guest-ordering]
      summary: Request cancellation of a guest order
      security:
        - sessionToken: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCancelRequest'
      responses:
        '201':
          description: Cancel request created

  /api/v1/staff/tables:
    get:
      tags: [ordering]
      summary: List tables, active sessions, orders, and item statuses for staff
      security:
        - bearerAuth: []
      description: 'Permission: ordering.staff'
      responses:
        '200':
          description: Staff table board
  /api/v1/staff/sessions/{sessionId}/request-bill:
    post:
      tags: [ordering]
      summary: Mark a dining session as requesting the bill
      security:
        - bearerAuth: []
      description: 'Permission: ordering.staff. This action uses only the sessionId path parameter.'
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bill request recorded
  /api/v1/staff/order-items/{itemId}/status:
    patch:
      tags: [ordering]
      summary: Update an order item status from the staff board
      security:
        - bearerAuth: []
      description: 'Permission: ordering.staff'
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemStatusRequest'
      responses:
        '200':
          description: Item status updated

  /api/v1/kitchen/queue:
    get:
      tags: [kitchen]
      summary: Kitchen display queue
      security:
        - bearerAuth: []
      description: 'Permission: kitchen.operate'
      responses:
        '501':
          description: Scaffold stub
  /api/v1/kitchen/items/{id}/status:
    patch:
      tags: [kitchen]
      summary: Update kitchen item status
      security:
        - bearerAuth: []
      description: 'Permission: kitchen.operate'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemStatusRequest'
      responses:
        '501':
          description: Scaffold stub

  /api/v1/billing/build-invoice:
    post:
      tags: [billing]
      summary: Build an invoice
      security:
        - bearerAuth: []
      description: 'Permission: billing.process'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildInvoiceRequest'
      responses:
        '200':
          description: Invoice built
  /api/v1/billing/adjust-invoice:
    post:
      tags: [billing]
      summary: Adjust an invoice
      security:
        - bearerAuth: []
      description: 'Permission: billing.process'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInvoiceRequest'
      responses:
        '200':
          description: Invoice adjusted
  /api/v1/billing/process-payment:
    post:
      tags: [billing]
      summary: Process a payment
      security:
        - bearerAuth: []
      description: >
        Permission: billing.process. Cash/card complete synchronously. Configured
        asynchronous providers (including SePay BANK_TRANSFER and E_WALLET
        methods) create a PROCESSING payment and return pay_url, deeplink, or
        qr_code_url; the invoice is paid only after the provider webhook is
        authenticated and reconciled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '200':
          description: Payment processed or initiated
  /api/v1/billing/payments/webhook/{provider}:
    post:
      tags: [billing]
      summary: Idempotent payment provider webhook
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [sepay, momo, zalopay, mock]
        - name: X-Mock-Signature
          in: header
          required: false
          description: HMAC signature required by the mock provider.
          schema: { type: string }
        - name: X-SePay-Signature
          in: header
          required: false
          description: SePay HMAC-SHA256 signature in sha256={hex} format.
          schema: { type: string }
        - name: X-SePay-Timestamp
          in: header
          required: false
          description: Unix timestamp in seconds used to sign the raw request body.
          schema: { type: string }
      description: Public signature-authenticated callback. Amount must match the stored payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Provider-specific acknowledgement
        '204':
          description: Provider-specific empty acknowledgement
  /api/v1/billing/payments/mock/complete:
    post:
      tags: [billing]
      summary: Complete mock e-wallet payment in non-production
      security: []
      description: Registered only when APP_ENV is not production; signs and routes through the real mock webhook handler.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockCompletePaymentRequest'
      responses:
        '200':
          description: Mock webhook applied
  /api/v1/customer/payment:
    get:
      tags: [billing]
      summary: Get invoices and current payment for the authenticated guest session
      security:
        - sessionToken: []
      responses:
        '200':
          description: Session invoices, including the current QR payment when available
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    required: [session_status, invoices]
                    properties:
                      session_status:
                        type: string
                        enum: [ACTIVE, AWAITING_PAYMENT, CLOSED]
                      invoices:
                        type: array
                        items: { type: object }
        '401':
          description: Missing, invalid, or expired guest session token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
  schemas:
    ScaffoldRequest:
      type: object
      description: Endpoint scaffold. The backend currently accepts an empty JSON object only.
      additionalProperties: false
      example: {}
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        data: {}
        meta: {}
        error:
          nullable: true
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    AuthenticateRequest:
      type: object
      required: [restaurant_code, username, password]
      properties:
        restaurant_code: { type: string, example: DEMO }
        username: { type: string, example: cashier }
        password: { type: string, format: password, example: demo1234 }
    JoinSessionRequest:
      type: object
      required: [qr_token]
      properties:
        qr_token: { type: string }
    OpenSessionRequest:
      type: object
      required: [table_id]
      properties:
        table_id: { type: string, format: uuid }
    CloseSessionRequest:
      type: object
      required: [session_id]
      properties:
        session_id: { type: string, format: uuid }
    ManageTableQRRequest:
      type: object
      required: [table_id]
      properties:
        table_id: { type: string, format: uuid }
        rotate: { type: boolean, default: false }
    GuestOrderOptionRequest:
      type: object
      required: [option_id, quantity]
      properties:
        option_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, example: 1 }
    GuestOrderLineRequest:
      type: object
      required: [menu_item_id, quantity]
      properties:
        menu_item_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid, nullable: true }
        quantity: { type: integer, minimum: 1, example: 1 }
        note: { type: string, example: Không cay }
        options:
          type: array
          items:
            $ref: '#/components/schemas/GuestOrderOptionRequest'
    GuestPlaceOrderRequest:
      type: object
      required: [items]
      properties:
        note: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GuestOrderLineRequest'
    GuestEditOrderLineRequest:
      type: object
      required: [order_item_id, quantity]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        note: { type: string }
        options:
          type: array
          items:
            $ref: '#/components/schemas/GuestOrderOptionRequest'
    GuestEditOrderRequest:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GuestEditOrderLineRequest'
    GuestCancelRequest:
      type: object
      required: [order_item_id, reason]
      properties:
        order_item_id: { type: string, format: uuid }
        reason: { type: string }
    UpdateItemStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, PREPARING, READY, SERVED, CANCELLED]
    BuildInvoiceRequest:
      type: object
      required: [dining_session_id]
      properties:
        dining_session_id: { type: string, format: uuid }
    AdjustInvoiceRequest:
      type: object
      required: [invoice_id, discount_amount_vnd]
      properties:
        invoice_id: { type: string, format: uuid }
        discount_amount_vnd: { type: integer, format: int64, minimum: 0 }
        discount_reason:
          type: string
          enum: [promo, regular, complaint]
    ProcessPaymentRequest:
      type: object
      required: [invoice_id, payment_method_code]
      properties:
        invoice_id: { type: string, format: uuid }
        payment_method_code:
          type: string
          example: cash
        received_amount_vnd:
          type: integer
          format: int64
          example: 500000
        reference_code: { type: string }
    PaymentWebhookRequest:
      type: object
      description: >
        Provider-specific webhook JSON. The fields below document the built-in mock
        provider; MoMo and ZaloPay send their native payload shapes.
      required: [event_id, gateway_transaction_id, payment_number, amount_vnd, status]
      properties:
        event_id: { type: string, example: evt_01 }
        gateway_transaction_id: { type: string, example: mock_txn_01 }
        payment_number: { type: string, example: PAY-20260606-0001 }
        amount_vnd: { type: integer, format: int64, example: 150000 }
        status:
          type: string
          enum: [success, failed]
    MockCompletePaymentRequest:
      type: object
      required: [payment_number]
      properties:
        payment_number: { type: string, example: PAY-20260606-0001 }
        result:
          type: string
          enum: [success, failed]
          default: success

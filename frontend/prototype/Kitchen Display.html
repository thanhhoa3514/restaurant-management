<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kitchen Display — Quán Cơm Tấm Sài Gòn</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
        animation: {
          'pulse-soft': 'pulseSoft 1s ease-in-out infinite',
          'fade-in': 'fadeIn 250ms ease-out',
          'fade-up': 'fadeUp 300ms ease-out',
          'fade-out': 'fadeOut 1.5s ease-out forwards',
          'slide-in-top': 'slideInTop 350ms cubic-bezier(0.16, 1, 0.3, 1)',
          'amber-pulse': 'amberPulse 1200ms ease-out',
        },
        keyframes: {
          pulseSoft: {
            '0%, 100%': { opacity: 1, transform: 'scale(1)' },
            '50%': { opacity: 0.65, transform: 'scale(1.04)' },
          },
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          fadeOut: {
            '0%': { opacity: 1, transform: 'scale(1)' },
            '100%': { opacity: 0, transform: 'scale(0.96)' },
          },
          fadeUp: {
            '0%': { opacity: 0, transform: 'translateY(8px)' },
            '100%': { opacity: 1, transform: 'translateY(0)' },
          },
          slideInTop: {
            '0%': { opacity: 0, transform: 'translateY(-16px) scale(0.98)' },
            '100%': { opacity: 1, transform: 'translateY(0) scale(1)' },
          },
          amberPulse: {
            '0%': { boxShadow: '0 0 0 0 rgba(245, 158, 11, 0.55)' },
            '70%': { boxShadow: '0 0 0 14px rgba(245, 158, 11, 0)' },
            '100%': { boxShadow: '0 0 0 0 rgba(245, 158, 11, 0)' },
          },
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #f5f5f4; /* stone-100 */
    color: #1c1917;
    -webkit-font-smoothing: antialiased;
    font-size: 18px; /* one tier larger */
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  /* Soft inner texture so the wall-display surface doesn't look flat */
  .kds-bg {
    background:
      radial-gradient(circle at 15% 0%, rgba(251, 191, 36, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 100% 100%, rgba(239, 68, 68, 0.04) 0%, transparent 50%),
      #f5f5f4;
    min-height: 100dvh;
  }
  .small-screen-gate {
    display: none;
  }
  @media (max-width: 1023px) {
    .small-screen-gate { display: flex; }
    .kds-app { display: none !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="kds-bg">
<!-- Small screen placeholder -->
<div class="small-screen-gate min-h-screen items-center justify-center px-6 text-center">
  <div class="max-w-md">
    <div class="mx-auto w-16 h-16 rounded-2xl bg-stone-900 text-white inline-flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/>
        <path d="M6 17h12"/>
      </svg>
    </div>
    <h1 class="mt-5 text-xl font-bold text-stone-900" data-vi="Màn hình này được thiết kế cho thiết bị lớn" data-en="This view is designed for kitchen displays">
      Màn hình này được thiết kế cho thiết bị lớn
    </h1>
    <p class="mt-2 text-sm text-stone-500 leading-relaxed" data-vi="Vui lòng mở trên màn hình rộng hơn (≥1024px) để xem giao diện bếp." data-en="Please open on a wider screen (≥1024px) to view the kitchen display.">
      Vui lòng mở trên màn hình rộng hơn (≥1024px) để xem giao diện bếp.
    </p>
    <div class="mt-4 text-xs text-stone-400 font-mono">Viewport: <span id="vp-size"></span></div>
  </div>
</div>

<div id="root" class="kds-app"></div>

<script>
  // Tiny script to keep the gate's viewport readout live, so it's useful during the demo if a reviewer resizes.
  const vp = document.getElementById('vp-size');
  const update = () => { if (vp) vp.textContent = window.innerWidth + ' × ' + window.innerHeight; };
  update();
  window.addEventListener('resize', update);
</script>

<script type="text/babel" src="kds-data.jsx"></script>
<script type="text/babel" src="kds-ui.jsx"></script>
<script type="text/babel" src="kds-card.jsx"></script>
<script type="text/babel" src="kds-app.jsx"></script>
</body>
</html>

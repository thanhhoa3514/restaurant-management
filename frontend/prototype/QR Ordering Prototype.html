<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Ordering — Quán Cơm Tấm Sài Gòn</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        animation: {
          'pulse-once': 'pulseOnce 400ms ease-out',
          'fade-in': 'fadeIn 250ms ease-out',
          'slide-up': 'slideUp 280ms cubic-bezier(0.16, 1, 0.3, 1)',
          'slide-in-right': 'slideInRight 280ms cubic-bezier(0.16, 1, 0.3, 1)',
          'fade-up': 'fadeUp 300ms ease-out',
        },
        keyframes: {
          pulseOnce: {
            '0%': { transform: 'scale(1)' },
            '50%': { transform: 'scale(1.35)' },
            '100%': { transform: 'scale(1)' },
          },
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          fadeUp: {
            '0%': { opacity: 0, transform: 'translateY(8px)' },
            '100%': { opacity: 1, transform: 'translateY(0)' },
          },
          slideUp: {
            '0%': { transform: 'translateY(100%)' },
            '100%': { transform: 'translateY(0)' },
          },
          slideInRight: {
            '0%': { transform: 'translateX(100%)' },
            '100%': { transform: 'translateX(0)' },
          },
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #fafaf9; /* stone-50 */
    color: #1c1917;
    -webkit-font-smoothing: antialiased;
  }
  /* Hide scrollbar for category tabs */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  /* Phone frame on desktop */
  .phone-shell {
    max-width: 28rem; /* max-w-md */
    margin-left: auto;
    margin-right: auto;
    min-height: 100dvh;
    position: relative;
    background: #fafaf9;
  }
  @media (min-width: 768px) {
    .phone-shell {
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.18), 0 8px 24px -8px rgba(0,0,0,0.08);
      margin-top: 24px;
      margin-bottom: 24px;
      border-radius: 28px;
      overflow: hidden;
      min-height: calc(100dvh - 48px);
    }
  }
  body.desktop-bg {
    background:
      radial-gradient(ellipse at top, #fef3c7 0%, transparent 50%),
      radial-gradient(ellipse at bottom, #fed7aa 0%, transparent 40%),
      #fafaf9;
    min-height: 100dvh;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="desktop-bg">
<div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cashier — Quán Cơm Tấm Sài Gòn</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
        animation: {
          'fade-in': 'fadeIn 200ms ease-out',
          'fade-up': 'fadeUp 280ms ease-out',
          'slide-in-right': 'slideInRight 280ms cubic-bezier(0.16, 1, 0.3, 1)',
          'spin-slow': 'spin 1.4s linear infinite',
          'check-in': 'checkIn 280ms cubic-bezier(0.16, 1, 0.3, 1)',
          'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          fadeUp: {
            '0%': { opacity: 0, transform: 'translateY(8px)' },
            '100%': { opacity: 1, transform: 'translateY(0)' },
          },
          slideInRight: {
            '0%': { transform: 'translateX(100%)' },
            '100%': { transform: 'translateX(0)' },
          },
          checkIn: {
            '0%': { opacity: 0, transform: 'scale(0.6)' },
            '60%': { opacity: 1, transform: 'scale(1.08)' },
            '100%': { opacity: 1, transform: 'scale(1)' },
          },
          pulseSubtle: {
            '0%, 100%': { opacity: 1 },
            '50%': { opacity: 0.6 },
          },
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #fafaf9;
    color: #1c1917;
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  /* Receipt-only print mode — hide everything except #receipt-print-area */
  @media print {
    body * { visibility: hidden !important; }
    #receipt-print-area, #receipt-print-area * { visibility: visible !important; }
    #receipt-print-area {
      position: fixed !important;
      left: 0; top: 0;
      width: 80mm;
      box-shadow: none !important;
      border: none !important;
      background: white !important;
    }
    .no-print { display: none !important; }
    @page { size: 80mm auto; margin: 4mm; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="cs-data.jsx"></script>
<script type="text/babel" src="cs-ui.jsx"></script>
<script type="text/babel" src="cs-invoice.jsx"></script>
<script type="text/babel" src="cs-payment.jsx"></script>
<script type="text/babel" src="cs-app.jsx"></script>
</body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith Restaurant - Client - Session Summary</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f2f2f7;
        --bg-canvas: #e7e7ec;
        --text: #1d1d1f;
        --text-secondary: rgba(60, 60, 67, 0.78);
        --text-tertiary: rgba(60, 60, 67, 0.55);
        --separator: rgba(60, 60, 67, 0.16);
        --blue: #007aff;
        --green: #34c759;
        --orange: #ff9500;
        --purple: #af52de;
        --red: #ff3b30;
        --pink: #ff2d55;
        --yellow: #ffcc00;
        --shadow: 0 28px 80px rgba(24, 24, 30, 0.16);
        --font:
          'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 100%;
        min-height: 100%;
        color: var(--text);
        background: var(--bg-canvas);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      svg {
        display: block;
      }

      .export-board {
        display: flex;
        align-items: flex-start;
        gap: 64px;
        width: max-content;
        min-width: 100%;
        padding: 64px;
      }

      .export-item {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .frame-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        color: #3a3a40;
      }

      .frame-label strong {
        font-size: 15px;
        letter-spacing: -0.01em;
      }

      .frame-label span {
        color: #6f6f77;
        font-size: 12px;
        font-weight: 600;
      }

      .figma-frame {
        position: relative;
        overflow: hidden;
        background: var(--bg);
        box-shadow: var(--shadow);
      }

      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .icon-sm {
        width: 16px;
        height: 16px;
      }

      .icon-lg {
        width: 22px;
        height: 22px;
      }

      /* Client frame */
      .client-screen {
        width: 390px;
        height: 844px;
        border-radius: 30px;
        background:
          radial-gradient(circle at 90% -10%, rgba(0, 122, 255, 0.09), transparent 28%), #fff;
      }

      .client-header {
        position: relative;
        z-index: 3;
        border-bottom: 1px solid var(--separator);
        background: rgba(255, 255, 255, 0.86);
        padding: 18px 16px 13px;
        backdrop-filter: blur(22px);
      }

      .client-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .client-brand {
        min-width: 0;
      }

      .client-brand h1 {
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .client-brand p {
        margin: 4px 0 0;
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 500;
      }

      .client-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .round-control,
      .lang-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        border: 1px solid var(--separator);
        background: rgba(242, 242, 247, 0.8);
        color: var(--text-secondary);
      }

      .round-control {
        width: 34px;
        border-radius: 50%;
      }

      .lang-control {
        min-width: 38px;
        border-radius: 999px;
        padding: 0 10px;
        font-size: 11px;
        font-weight: 750;
      }

      .table-pill {
        height: 34px;
        border-radius: 999px;
        background: rgba(0, 122, 255, 0.09);
        color: var(--blue);
        padding: 0 11px;
        font-size: 11px;
        font-weight: 750;
        line-height: 34px;
        white-space: nowrap;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        margin-top: 13px;
        border: 1px solid rgba(60, 60, 67, 0.1);
        border-radius: 13px;
        background: var(--bg-soft);
        padding: 0 12px;
        color: var(--text-tertiary);
      }

      .search-box span {
        font-size: 13px;
        font-weight: 500;
      }

      .category-strip {
        display: flex;
        gap: 7px;
        overflow: hidden;
        padding: 12px 16px 10px;
      }

      .category-chip {
        flex: none;
        height: 34px;
        border: 0;
        border-radius: 11px;
        background: var(--bg-soft);
        color: var(--text-secondary);
        padding: 0 14px;
        font-size: 12px;
        font-weight: 650;
      }

      .category-chip.active {
        background: var(--text);
        color: #fff;
        box-shadow: 0 7px 16px rgba(29, 29, 31, 0.16);
      }

      .client-content {
        padding: 2px 16px 112px;
      }

      .section-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin: 3px 0 10px;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 750;
        letter-spacing: -0.025em;
      }

      .section-heading span {
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 600;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
      }

      .menu-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgba(60, 60, 67, 0.12);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 24px rgba(24, 24, 30, 0.06);
      }

      .food-visual {
        position: relative;
        height: 112px;
        overflow: hidden;
      }

      .food-visual svg {
        width: 100%;
        height: 100%;
      }

      .food-badge {
        position: absolute;
        top: 9px;
        left: 9px;
        height: 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        color: #8b5d21;
        padding: 0 8px;
        font-size: 8px;
        font-weight: 850;
        letter-spacing: 0.06em;
        line-height: 22px;
        backdrop-filter: blur(12px);
      }

      .menu-card-copy {
        padding: 10px 11px 11px;
      }

      .menu-card h3 {
        min-height: 32px;
        margin: 0;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1.25;
      }

      .menu-card p {
        overflow: hidden;
        margin: 3px 0 7px;
        color: var(--text-tertiary);
        font-size: 9.5px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .menu-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .price {
        color: var(--blue);
        font-size: 12px;
        font-weight: 750;
      }

      .add-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: rgba(0, 122, 255, 0.1);
        color: var(--blue);
        font-size: 18px;
        font-weight: 500;
        line-height: 1;
      }

      .client-bottom-fade {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 4;
        height: 108px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 63%);
        pointer-events: none;
      }

      .cart-button {
        position: absolute;
        bottom: 24px;
        left: 50%;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 54px;
        border-radius: 999px;
        background: var(--blue);
        box-shadow: 0 14px 34px rgba(0, 122, 255, 0.33);
        color: #fff;
        padding: 0 25px;
        font-size: 14px;
        font-weight: 750;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .cart-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 23px;
        height: 23px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        padding: 0 7px;
        font-size: 11px;
      }

      /* Admin frame */
      .admin-screen {
        width: 1440px;
        height: 1024px;
        background:
          radial-gradient(circle at 86% 2%, rgba(175, 82, 222, 0.07), transparent 23%), #f8f8fa;
      }

      .admin-layout {
        display: flex;
        height: 100%;
      }

      .admin-sidebar {
        width: 264px;
        flex: none;
        border-right: 1px solid var(--separator);
        background: rgba(255, 255, 255, 0.78);
        padding: 22px 16px;
        backdrop-filter: blur(26px);
      }

      .admin-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 8px 28px;
      }

      .brand-mark {
        display: flex;
        width: 44px;
        height: 44px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: var(--text);
        color: #fff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: -0.03em;
      }

      .admin-brand strong {
        display: block;
        overflow: hidden;
        max-width: 165px;
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .admin-brand span {
        display: block;
        margin-top: 3px;
        color: var(--purple);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .nav-group + .nav-group {
        margin-top: 25px;
      }

      .nav-group-label {
        margin: 0 12px 7px;
        color: var(--text-tertiary);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 47px;
        border-radius: 15px;
        color: var(--text-secondary);
        padding: 0 12px;
        font-size: 14px;
        font-weight: 670;
      }

      .nav-item + .nav-item {
        margin-top: 3px;
      }

      .nav-item.active {
        background: rgba(175, 82, 222, 0.11);
        color: var(--purple);
      }

      .nav-item .icon {
        width: 19px;
        height: 19px;
      }

      .admin-main {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
      }

      .admin-header {
        display: flex;
        min-height: 78px;
        flex: none;
        align-items: center;
        gap: 22px;
        border-bottom: 1px solid var(--separator);
        background: rgba(255, 255, 255, 0.78);
        padding: 13px 24px;
        backdrop-filter: blur(26px);
      }

      .admin-title {
        min-width: 310px;
      }

      .admin-title .eyebrow {
        margin: 0 0 2px;
        color: var(--purple);
        font-size: 9.5px;
        font-weight: 850;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .admin-title h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.025em;
        line-height: 1.15;
      }

      .admin-title .subtitle {
        margin: 3px 0 0;
        color: var(--text-secondary);
        font-size: 11.5px;
        font-weight: 520;
      }

      .live-clock {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 39px;
        margin-left: auto;
        border-radius: 999px;
        background: rgba(242, 242, 247, 0.88);
        color: var(--text);
        padding: 0 16px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.04em;
      }

      .admin-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .search-action {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        border: 1px solid var(--separator);
        border-radius: 999px;
        background: rgba(242, 242, 247, 0.65);
        color: var(--text-secondary);
        padding: 0 12px;
        font-size: 12px;
        font-weight: 600;
      }

      .search-action kbd {
        border-radius: 6px;
        background: #fff;
        color: var(--text-tertiary);
        padding: 3px 6px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 9px;
      }

      .header-icon,
      .profile-avatar {
        display: flex;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--separator);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
        color: var(--text-secondary);
      }

      .profile-avatar {
        border: 0;
        background: var(--purple);
        color: #fff;
        font-size: 14px;
        font-weight: 850;
      }

      .admin-content {
        min-height: 0;
        flex: 1;
        overflow: hidden;
        padding: 24px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .admin-card {
        border: 1px solid rgba(60, 60, 67, 0.13);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 10px 34px rgba(24, 24, 30, 0.045);
        backdrop-filter: blur(24px);
      }

      .metric-card {
        min-height: 148px;
        padding: 20px;
      }

      .metric-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .metric-label {
        color: var(--text-tertiary);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.13em;
        line-height: 1.45;
        text-transform: uppercase;
      }

      .metric-icon {
        display: flex;
        width: 40px;
        height: 40px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
      }

      .metric-icon.green {
        background: rgba(52, 199, 89, 0.11);
        color: var(--green);
      }

      .metric-icon.blue {
        background: rgba(0, 122, 255, 0.1);
        color: var(--blue);
      }

      .metric-icon.orange {
        background: rgba(255, 149, 0, 0.12);
        color: var(--orange);
      }

      .metric-icon.purple {
        background: rgba(175, 82, 222, 0.11);
        color: var(--purple);
      }

      .metric-value {
        margin-top: 15px;
        font-size: 28px;
        font-weight: 760;
        letter-spacing: -0.035em;
      }

      .metric-sub {
        margin-top: 3px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 520;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 20px;
        margin-top: 20px;
      }

      .staff-card {
        overflow: hidden;
      }

      .card-header {
        display: flex;
        min-height: 70px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--separator);
        padding: 0 20px;
      }

      .card-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        font-size: 18px;
        font-weight: 740;
        letter-spacing: -0.02em;
      }

      .card-title .icon {
        color: var(--purple);
      }

      .status-pill {
        height: 28px;
        border-radius: 999px;
        background: rgba(52, 199, 89, 0.1);
        color: #168c38;
        padding: 0 12px;
        font-size: 10px;
        font-weight: 800;
        line-height: 28px;
      }

      .staff-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .staff-table th {
        height: 42px;
        background: rgba(242, 242, 247, 0.62);
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.11em;
        text-align: left;
        text-transform: uppercase;
      }

      .staff-table th,
      .staff-table td {
        padding: 0 16px;
      }

      .staff-table tbody tr {
        height: 63px;
        border-top: 1px solid rgba(60, 60, 67, 0.1);
      }

      .staff-table tbody tr:first-child {
        border-top: 0;
      }

      .staff-name {
        font-size: 12.5px;
        font-weight: 700;
      }

      .staff-code,
      .staff-time {
        color: var(--text-secondary);
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 10.5px;
      }

      .staff-time {
        text-align: right;
      }

      .role-pill {
        display: inline-flex;
        align-items: center;
        height: 25px;
        border-radius: 999px;
        padding: 0 9px;
        font-size: 9px;
        font-weight: 800;
      }

      .role-pill.purple {
        background: rgba(175, 82, 222, 0.1);
        color: var(--purple);
      }

      .role-pill.green {
        background: rgba(52, 199, 89, 0.1);
        color: #168c38;
      }

      .role-pill.blue {
        background: rgba(0, 122, 255, 0.1);
        color: var(--blue);
      }

      .role-pill.orange {
        background: rgba(255, 149, 0, 0.12);
        color: #b86b00;
      }

      .on-duty {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #168c38;
        font-size: 9.5px;
        font-weight: 800;
      }

      .on-duty::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        content: '';
      }

      .quick-card {
        padding: 20px;
      }

      .quick-card .card-title {
        margin-bottom: 17px;
      }

      .quick-action {
        display: flex;
        min-height: 75px;
        align-items: center;
        gap: 12px;
        border-radius: 18px;
        background: rgba(242, 242, 247, 0.78);
        padding: 10px 12px;
      }

      .quick-action + .quick-action {
        margin-top: 11px;
      }

      .quick-icon {
        display: flex;
        width: 42px;
        height: 42px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: #fff;
        color: var(--text-secondary);
      }

      .quick-copy {
        min-width: 0;
        flex: 1;
      }

      .quick-copy strong {
        display: block;
        font-size: 12px;
        font-weight: 720;
      }

      .quick-copy span {
        display: block;
        overflow: hidden;
        margin-top: 3px;
        color: var(--text-secondary);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .quick-arrow {
        color: var(--text-tertiary);
      }

      .activity-strip {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 14px;
        margin-top: 20px;
      }

      .activity-card {
        display: flex;
        min-height: 126px;
        align-items: center;
        gap: 15px;
        padding: 18px;
      }

      .activity-art {
        display: flex;
        width: 58px;
        height: 58px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
      }

      .activity-art.blue {
        background: rgba(0, 122, 255, 0.1);
        color: var(--blue);
      }

      .activity-art.orange {
        background: rgba(255, 149, 0, 0.12);
        color: var(--orange);
      }

      .activity-art.green {
        background: rgba(52, 199, 89, 0.1);
        color: var(--green);
      }

      .activity-copy strong {
        display: block;
        font-size: 13px;
        font-weight: 740;
      }

      .activity-copy p {
        margin: 5px 0 0;
        color: var(--text-secondary);
        font-size: 10.5px;
        line-height: 1.45;
      }

      /* Additional route export frames */
      .mobile-dark-screen,
      .guest-flow-screen {
        width: 390px;
        height: 844px;
        border-radius: 30px;
      }

      .mobile-dark-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at -10% -8%, rgba(0, 122, 255, 0.18), transparent 36%),
          radial-gradient(circle at 110% 108%, rgba(175, 82, 222, 0.18), transparent 36%), #09090b;
        color: #f4f4f5;
        padding: 28px;
      }

      .portal-stack,
      .login-stack {
        width: 100%;
        text-align: center;
      }

      .portal-logo,
      .login-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #27272a;
        background: #18181b;
        color: #fff;
        font-weight: 900;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
      }

      .portal-logo {
        width: 66px;
        height: 66px;
        border-radius: 22px;
        font-size: 31px;
      }

      .login-logo {
        width: 58px;
        height: 58px;
        border-radius: 20px;
        font-size: 27px;
      }

      .portal-stack h1,
      .login-stack h1 {
        margin: 18px 0 8px;
        color: #fff;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.045em;
      }

      .portal-stack > p,

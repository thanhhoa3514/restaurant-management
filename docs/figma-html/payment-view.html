<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Zenith — Thanh toán QR (khách)</title>
    <style>
      /* Hallmark · genre: modern-minimal · macrostructure: mobile guest checkout — centered SePay QR card + amount + transfer-reference chip + keep-open footer · tone: warm Apple Glass, light-only, calm · anchor hue: system blue (reference/action) on near-black · extraction: production OrderingProvider GuestPaymentScreen (payment.status PROCESSING) */
      :root {
        color-scheme: light;
        --font-body:
          "SF Pro Text", "SF Pro Display", "Helvetica Neue", ui-sans-serif,
          sans-serif;
        --font-mono: "SF Mono", ui-monospace, "Roboto Mono", monospace;
        --bg: #ffffff;
        --surface-grouped: #f2f2f7;
        --material-thin: rgba(255, 255, 255, 0.78);
        --material-regular: rgba(255, 255, 255, 0.94);
        --separator: rgba(60, 60, 67, 0.16);
        --text: #1d1d1f;
        --text-secondary: rgba(29, 29, 31, 0.72);
        --text-tertiary: rgba(29, 29, 31, 0.5);
        --system-blue: #007aff;
        --system-green: #34c759;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--surface-grouped);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button {
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      svg {
        display: block;
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* Phone frame */
      .device {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        background: var(--surface-grouped);
      }
      @media (min-width: 30rem) {
        body {
          padding: 24px 0;
        }
        .device {
          margin-inline: auto;
          width: 100%;
          max-width: 28rem;
          min-height: calc(100dvh - 48px);
          border: 1px solid var(--separator);
          border-radius: 28px;
          overflow: hidden;
          box-shadow: 0 30px 80px rgba(29, 29, 31, 0.22);
        }
      }

      /* Header */
      .header {
        flex: 0 0 auto;
        border-block-end: 1px solid var(--separator);
        background: var(--material-thin);
        backdrop-filter: blur(24px);
        padding: 20px 16px 16px;
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        color: var(--text-tertiary);
        font-size: 12px;
        font-weight: 600;
      }
      .h-title {
        margin: 4px 0 0;
        font-size: 20px;
        font-weight: 850;
        letter-spacing: -0.02em;
      }

      /* Main */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px 16px;
      }
      .card {
        border: 1px solid var(--separator);
        border-radius: 22px;
        background: var(--material-regular);
        padding: 20px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(29, 29, 31, 0.08);
      }

      /* SePay brand strip */
      .pay-brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 14px;
        border-radius: 999px;
        background: var(--surface-grouped);
        padding: 5px 12px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .pay-brand b {
        color: var(--system-blue);
      }

      /* QR */
      .qr-frame {
        display: grid;
        width: 100%;
        max-width: 280px;
        margin: 0 auto;
        aspect-ratio: 1;
        place-items: center;
        border-radius: 14px;
        background: #fff;
        padding: 14px;
        box-shadow: inset 0 0 0 1px rgba(60, 60, 67, 0.1);
      }
      .qr-frame svg {
        width: 100%;
        height: 100%;
      }

      .amount {
        margin: 20px 0 0;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .ref-label {
        margin: 8px 0 0;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .ref-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        max-width: 100%;
        margin-top: 8px;
        border: 0;
        border-radius: 14px;
        background: var(--surface-grouped);
        padding: 0 16px;
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 700;
      }
      .ref-chip .num {
        word-break: break-all;
      }
      .ref-chip svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: var(--text-secondary);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .card-hint {
        margin: 20px 0 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.5;
      }

      /* Live status pill */
      .live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 16px;
        border-radius: 999px;
        background: rgba(52, 199, 89, 0.12);
        padding: 6px 12px;
        color: #1d8a3f;
        font-size: 12px;
        font-weight: 800;
      }
      .live .pulse {
        position: relative;
        width: 8px;
        height: 8px;
      }
      .live .pulse::before,
      .live .pulse::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--system-green);
      }
      .live .pulse::after {
        animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes ping {
        75%,
        100% {
          transform: scale(2.6);
          opacity: 0;
        }
      }

      /* Footer */
      .footer {
        flex: 0 0 auto;
        border-block-start: 1px solid var(--separator);
        background: var(--material-thin);
        backdrop-filter: blur(24px);
        padding: 16px calc(16px + env(safe-area-inset-bottom));
        text-align: center;
        color: var(--text-tertiary);
        font-size: 12px;
      }
    </style>
  </head>

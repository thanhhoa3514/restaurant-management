# RTK project policy for Codex/agent work.
#
# Keep RTK useful for noisy verification output, but never let it
# distort source-of-truth discovery. Discovery commands must reach the model
# with native semantics and uncompressed paths/content.

[hooks]
# Hook rewrite denylist: these commands are discovery/source-of-truth tools.
# Do not rewrite them to RTK compact variants.
exclude_commands = [
  "find",
  "grep",
  "rg",
  "ls",
  "cat",
  "head",
  "tail",
  "sed",
  "awk",
  "tree",
  "read",
]

[tee]
# Keep tee useful for failures without flooding context.
enabled = true
mode = "failures"

[limits]
# Conservative defaults for filtered commands that remain useful:
# compile/test/log/diff wrappers can still compress noisy output.
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 50
status_max_untracked = 50
passthrough_max_chars = 4000

# Edge reverse proxy. Cloudflare (proxy ON) terminates TLS and forwards :80 here.
# 'api' and 'web' = container names on the shared 'restaurant' docker network.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # API → Go backend (routes under /api/v1, keep full path).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket realtime hub.
    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Menu images → MinIO (bucket needs anonymous download policy).
    location /restaurant-images/ {
        proxy_pass http://minio:9000/restaurant-images/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health {
        proxy_pass http://api:8080;
        access_log off;
    }

    # Everything else → frontend static (SPA fallback lives in the web image).
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

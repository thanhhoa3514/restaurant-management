services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../logs/nginx:/var/log/nginx
    networks:
      - restaurant
    restart: unless-stopped

networks:
  restaurant:
    external: true

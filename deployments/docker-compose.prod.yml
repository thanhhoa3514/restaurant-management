# Production stack for jackiengo.io.vn (single VPS + Cloudflare in front for TLS).
#   web (nginx) :80  → serves FE static, proxies /api + /ws → api:8080
#   api         :8080 (internal)
#   postgres, minio     (internal, bound to loopback only)
# Boot order: postgres healthy → migrate → seed → api.
#
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["/bin/restaurant-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["/bin/restaurant-seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-demo1234}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set a strong secret in .env}
      JWT_TTL: ${JWT_TTL:-12h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-restaurant-images}
      S3_USE_SSL: "false"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Empty → same-origin relative API + window.location.origin QR. Override
        # only if FE and API live on different hosts.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
